name: AutomationBench offline admission
on:
  push:
    branches: ['integration/automationbench-admission']
    paths:
      - 'integrations/automationbench/**'
      - '.github/workflows/automationbench-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATIONBENCH_STRICT_ASSERTIONS: '1'
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fork and pinned native runtime
        run: python -m pip install -e . -e './integrations/automationbench[native,test]'
      - name: Integration lint, native binding, and two offline regression passes
        run: python integrations/automationbench/scripts/offline_acceptance.py --output admission-results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automationbench-offline-admission
          path: admission-results/
          if-no-files-found: warn
